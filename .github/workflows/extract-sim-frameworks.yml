name: Extract Simulator Metal Frameworks

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-14  # Apple Silicon (arm64), Xcode 15.4 default

    steps:
      - name: Environment info
        run: |
          xcodebuild -version
          sw_vers
          uname -m

      - name: Probe all possible framework locations
        run: |
          echo "=== Searching Xcode.app ==="
          find /Applications/Xcode.app -name "MTLSimDriver.framework" 2>/dev/null || true
          find /Applications/Xcode.app -name "MTLSimImplementation.framework" 2>/dev/null || true
          find /Applications/Xcode.app -name "MetalSerializer.framework" 2>/dev/null || true
          echo "=== Searching CoreSimulator ==="
          find /Library/Developer/CoreSimulator -name "MTLSimDriver.framework" 2>/dev/null | head -5 || true
          echo "=== Pre-installed runtimes ==="
          xcrun simctl runtime list 2>/dev/null || true
          ls /Library/Developer/CoreSimulator/Profiles/Runtimes/ 2>/dev/null || echo "(empty)"
          ls /Library/Developer/CoreSimulator/Images/ 2>/dev/null || echo "(no Images dir)"

      - name: Find or download iOS Simulator Runtime
        id: find_runtime
        run: |
          find_runtime_root() {
            for p in \
              "/Library/Developer/CoreSimulator/Volumes/iOS_*/Contents/Resources/RuntimeRoot" \
              "/Library/Developer/CoreSimulator/Profiles/Runtimes/iOS*.simruntime/Contents/Resources/RuntimeRoot" \
              "/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Library/Developer/CoreSimulator/Profiles/Runtimes/iOS*.simruntime/Contents/Resources/RuntimeRoot"
            do
              FOUND=$(ls -d $p 2>/dev/null | head -1)
              [ -n "$FOUND" ] && echo "$FOUND" && return 0
            done
            return 1
          }

          # Check if already present
          RUNTIME_ROOT=$(find_runtime_root)
          if [ -n "$RUNTIME_ROOT" ]; then
            echo "Pre-installed runtime found: $RUNTIME_ROOT"
            echo "runtime_root=$RUNTIME_ROOT" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Download — no -buildVersion, just let Xcode pick the recommended iOS runtime
          echo "No runtime found, downloading..."
          xcodebuild -downloadPlatform iOS
          echo "Download complete."

          RUNTIME_ROOT=$(find_runtime_root)
          if [ -z "$RUNTIME_ROOT" ]; then
            echo "ERROR: RuntimeRoot still not found after download. Current state:"
            find /Library/Developer/CoreSimulator -maxdepth 5 -type d 2>/dev/null | head -40
            xcrun simctl runtime list 2>/dev/null || true
            exit 1
          fi

          echo "runtime_root=$RUNTIME_ROOT" >> $GITHUB_OUTPUT
        timeout-minutes: 45

      - name: Extract Metal Simulator Frameworks
        run: |
          RUNTIME_ROOT="${{ steps.find_runtime.outputs.runtime_root }}"
          OUT="sim-frameworks"
          mkdir -p "$OUT"

          for FW in MTLSimDriver MTLSimImplementation MetalSerializer; do
            SRC="$RUNTIME_ROOT/System/Library/PrivateFrameworks/${FW}.framework"
            if [ -d "$SRC" ]; then
              echo "Copying $FW.framework ..."
              cp -R "$SRC" "$OUT/"
              BIN=$(find "$OUT/${FW}.framework" -name "$FW" -type f | head -1)
              [ -n "$BIN" ] && lipo -info "$BIN" || echo "  (no binary found)"
            else
              echo "ERROR: $SRC not found"
              ls "$RUNTIME_ROOT/System/Library/PrivateFrameworks/" | grep -iE "mtl|metal" || true
            fi
          done

          echo "=== Result ==="
          find "$OUT" -type f | sort
          du -sh "$OUT"

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sim-metal-frameworks
          path: sim-frameworks/
          retention-days: 7

name: Package macOS 13.4 Rootfs

on:
  workflow_dispatch:

jobs:
  package-rootfs:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /Applications/Xcode_15.*.app 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator/Images 2>/dev/null || true
          df -h /

      - name: Download IPSW
        run: |
          curl -L --retry 3 -o /tmp/macos.ipsw \
            "https://updates.cdn-apple.com/2023SpringFCS/fullrestores/032-84884/F97A22EE-9B5E-4FD5-94C1-B39DCEE8D80F/UniversalMac_13.4_22F66_Restore.ipsw"
          ls -lh /tmp/macos.ipsw
          df -h /

      - name: Package rootfs
        run: |
          set -euo pipefail
          echo "--- 解压 rootfs DMG ---"
          unzip /tmp/macos.ipsw "096-09648-074.dmg" -d /tmp/

          echo "--- 挂载 ---"
          sudo hdiutil attach /tmp/096-09648-074.dmg -mountpoint /tmp/rootfs -nobrowse -readonly

          echo "--- 打包 rootfs.tar.gz ---"
          sudo tar -C /tmp/rootfs -czf /tmp/rootfs.tar.gz .

          echo "--- 清理 ---"
          sudo hdiutil detach /tmp/rootfs || true
          rm /tmp/096-09648-074.dmg
          ls -lh /tmp/rootfs.tar.gz
          df -h /

      - name: Package cryptex
        run: |
          set -euo pipefail
          echo "--- 解压 cryptex DMG ---"
          unzip /tmp/macos.ipsw "096-09706-077.dmg" -d /tmp/
          rm /tmp/macos.ipsw

          echo "--- 挂载 ---"
          sudo hdiutil attach /tmp/096-09706-077.dmg -mountpoint /tmp/cryptex -nobrowse -readonly

          echo "--- 打包 cryptex.tar.gz ---"
          sudo tar -C /tmp/cryptex -czf /tmp/cryptex.tar.gz .

          echo "--- 清理 ---"
          sudo hdiutil detach /tmp/cryptex || true
          rm /tmp/096-09706-077.dmg
          ls -lh /tmp/rootfs.tar.gz /tmp/cryptex.tar.gz
          df -h /

      - name: Split and upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # GitHub Release 单文件上限 2GB，按 1.9GB 分割
          split -b 1900m /tmp/rootfs.tar.gz  /tmp/rootfs.tar.gz.part_
          split -b 1900m /tmp/cryptex.tar.gz /tmp/cryptex.tar.gz.part_
          ls -lh /tmp/rootfs.tar.gz.part_* /tmp/cryptex.tar.gz.part_*

          # 创建 release（已存在则忽略错误）
          gh release create macos-13.4-rootfs \
            --repo "${{ github.repository }}" \
            --title "macOS 13.4 Rootfs + Cryptex" \
            --notes "macOS 13.4 (22F66) arm64 rootfs and OS cryptex" \
            --prerelease 2>/dev/null || true

          # 上传所有分片
          gh release upload macos-13.4-rootfs \
            --repo "${{ github.repository }}" \
            --clobber \
            /tmp/rootfs.tar.gz.part_* /tmp/cryptex.tar.gz.part_*

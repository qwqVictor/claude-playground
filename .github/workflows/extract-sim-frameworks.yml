name: Extract Simulator Metal Frameworks

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-14  # Apple Silicon arm64, pre-installed iOS 17.x runtime DMGs

    steps:
      - name: Mount iOS runtime DMG and extract frameworks
        run: |
          set -euo pipefail

          IMAGES_DIR="/Library/Developer/CoreSimulator/Images"
          MOUNT_POINT="/tmp/sim_runtime_mount"
          OUT="sim-frameworks"
          mkdir -p "$OUT" "$MOUNT_POINT"

          # Pick the first available iOS runtime UUID from simctl
          # Format: "iOS 17.5 (21F79) - 3F1204A6-D757-45BC-965D-71A3F6B8EF14 (Ready)"
          UUID=$(xcrun simctl runtime list 2>/dev/null \
            | grep -E "^iOS .* \(Ready\)" \
            | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}" \
            | head -1)

          if [ -z "$UUID" ]; then
            echo "ERROR: No Ready iOS runtime found"
            xcrun simctl runtime list
            exit 1
          fi

          DMG="$IMAGES_DIR/${UUID}.dmg"
          echo "Using runtime UUID: $UUID"
          echo "DMG path: $DMG"
          ls -lh "$DMG"

          echo "Mounting..."
          sudo hdiutil attach "$DMG" -mountpoint "$MOUNT_POINT" -nobrowse -readonly

          echo "Mounted. Locating RuntimeRoot..."
          RUNTIME_ROOT=$(find "$MOUNT_POINT" -name "RuntimeRoot" -type d | head -1)
          echo "RuntimeRoot: $RUNTIME_ROOT"

          if [ -z "$RUNTIME_ROOT" ]; then
            echo "Contents of mount (full):"
            find "$MOUNT_POINT" -type d
            sudo hdiutil detach "$MOUNT_POINT" || true
            exit 1
          fi

          for FW in MTLSimDriver MTLSimImplementation MetalSerializer; do
            SRC="$RUNTIME_ROOT/System/Library/PrivateFrameworks/${FW}.framework"
            if [ -d "$SRC" ]; then
              echo "Copying $FW.framework ..."
              cp -R "$SRC" "$OUT/"
              BIN=$(find "$OUT/${FW}.framework" -name "$FW" -not -name "*.h" -type f | head -1)
              [ -n "$BIN" ] && lipo -info "$BIN" || echo "  (no binary found)"
            else
              echo "WARNING: $FW.framework not found at $SRC"
              ls "$RUNTIME_ROOT/System/Library/PrivateFrameworks/" | grep -iE "mtl|metal" || true
            fi
          done

          echo "Unmounting..."
          sudo hdiutil detach "$MOUNT_POINT" || true

          echo ""
          echo "=== Result ==="
          find "$OUT" -type f | sort
          du -sh "$OUT"

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sim-metal-frameworks
          path: sim-frameworks/
          retention-days: 7

  package-rootfs:
    runs-on: macos-14

    steps:
      - name: Free up disk space
        run: |
          # Remove large pre-installed software to make room
          sudo rm -rf /Applications/Xcode_15.*.app 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator/Images 2>/dev/null || true
          df -h /

      - name: Extract rootfs DMG from IPSW via HTTP Range (no full download)
        run: |
          set -euo pipefail
          IPSW_URL="https://updates.cdn-apple.com/2023SpringFCS/fullrestores/032-84884/F97A22EE-9B5E-4FD5-94C1-B39DCEE8D80F/UniversalMac_13.4_22F66_Restore.ipsw"
          TARGET_DMG="096-09648-074.dmg"

          python3 << 'PYEOF'
          import struct, urllib.request, sys, os

          IPSW_URL = "https://updates.cdn-apple.com/2023SpringFCS/fullrestores/032-84884/F97A22EE-9B5E-4FD5-94C1-B39DCEE8D80F/UniversalMac_13.4_22F66_Restore.ipsw"
          TARGET = "096-09648-074.dmg"
          OUT_PATH = f"/tmp/{TARGET}"

          def http_range(url, start, end=None):
              req = urllib.request.Request(url)
              if end:
                  req.add_header("Range", f"bytes={start}-{end}")
              else:
                  req.add_header("Range", f"bytes={start}-")
              return urllib.request.urlopen(req)

          # 1. Get file size
          req = urllib.request.Request(IPSW_URL, method='HEAD')
          with urllib.request.urlopen(req) as r:
              total_size = int(r.headers['Content-Length'])
          print(f"IPSW total size: {total_size:,} bytes ({total_size/1e9:.1f} GB)")

          # 2. Fetch last 65KB to find End-of-Central-Directory
          with http_range(IPSW_URL, total_size - 65536) as r:
              tail = r.read()

          # 3. Find EOCD signature (PK\x05\x06)
          eocd_offset = tail.rfind(b'PK\x05\x06')
          if eocd_offset < 0:
              print("ERROR: EOCD not found")
              sys.exit(1)
          eocd = tail[eocd_offset:]
          cd_size   = struct.unpack_from('<I', eocd, 12)[0]
          cd_offset = struct.unpack_from('<I', eocd, 16)[0]
          print(f"Central directory: offset={cd_offset:,} size={cd_size:,}")

          # 4. Fetch central directory
          with http_range(IPSW_URL, cd_offset, cd_offset + cd_size - 1) as r:
              cd_data = r.read()

          # 5. Find our target file's local header offset
          pos = 0
          local_offset = None
          comp_size = None
          uncomp_size = None
          while pos < len(cd_data):
              sig = cd_data[pos:pos+4]
              if sig != b'PK\x01\x02':
                  break
              comp_method  = struct.unpack_from('<H', cd_data, pos+10)[0]
              comp_sz      = struct.unpack_from('<I', cd_data, pos+20)[0]
              uncomp_sz    = struct.unpack_from('<I', cd_data, pos+24)[0]
              fname_len    = struct.unpack_from('<H', cd_data, pos+28)[0]
              extra_len    = struct.unpack_from('<H', cd_data, pos+30)[0]
              comment_len  = struct.unpack_from('<H', cd_data, pos+32)[0]
              lhdr_offset  = struct.unpack_from('<I', cd_data, pos+42)[0]
              fname = cd_data[pos+46:pos+46+fname_len].decode('utf-8', errors='replace')
              if fname == TARGET:
                  local_offset = lhdr_offset
                  comp_size = comp_sz
                  uncomp_size = uncomp_sz
                  print(f"Found: {fname}")
                  print(f"  method={comp_method} comp={comp_sz:,} uncomp={uncomp_sz:,} lhdr_off={lhdr_offset:,}")
                  if comp_method != 0:
                      print(f"  WARNING: file is compressed (method={comp_method}), cannot range-extract directly")
                  break
              pos += 46 + fname_len + extra_len + comment_len

          if local_offset is None:
              print(f"ERROR: {TARGET} not found in central directory")
              sys.exit(1)

          # 6. Read local file header to get data start offset
          with http_range(IPSW_URL, local_offset, local_offset + 1023) as r:
              lhdr = r.read()
          fname_len = struct.unpack_from('<H', lhdr, 26)[0]
          extra_len = struct.unpack_from('<H', lhdr, 28)[0]
          data_start = local_offset + 30 + fname_len + extra_len

          print(f"Data starts at byte {data_start:,}")
          print(f"Downloading {comp_size/1e9:.2f} GB ...")

          # 7. Download the file data
          CHUNK = 8 * 1024 * 1024
          downloaded = 0
          with http_range(IPSW_URL, data_start, data_start + comp_size - 1) as r:
              with open(OUT_PATH, 'wb') as out:
                  while True:
                      chunk = r.read(CHUNK)
                      if not chunk:
                          break
                      out.write(chunk)
                      downloaded += len(chunk)
                      pct = downloaded / comp_size * 100
                      print(f"\r  {downloaded/1e9:.2f}/{comp_size/1e9:.2f} GB ({pct:.1f}%)", end='', flush=True)
          print(f"\nDone: {os.path.getsize(OUT_PATH):,} bytes")
          PYEOF

          ls -lh /tmp/$TARGET_DMG
          df -h /

      - name: Mount rootfs DMG and create compressed tarball
        run: |
          set -euo pipefail
          DMG="/tmp/096-09648-074.dmg"
          MOUNT="/tmp/rootfs_mount"
          mkdir -p "$MOUNT"

          echo "Mounting DMG..."
          sudo hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -readonly
          df -h /

          echo "Creating compressed tarball (excluding non-essential paths)..."
          sudo tar -C "$MOUNT" \
            --exclude='./System/Library/Fonts' \
            --exclude='./System/Library/Sounds' \
            --exclude='./System/Library/Perl' \
            --exclude='./System/Library/Python' \
            --exclude='./System/Library/Tcl' \
            --exclude='./System/Library/Spotlight' \
            --exclude='./System/Library/CacheDelete' \
            --exclude='./System/Library/Documentation' \
            --exclude='./System/iOSSupport' \
            --exclude='./System/Applications' \
            --exclude='./Applications' \
            --exclude='./usr/share/man' \
            --exclude='./usr/share/locale' \
            -cJf /tmp/rootfs.tar.xz .

          echo "Unmounting..."
          sudo hdiutil detach "$MOUNT" || true
          ls -lh /tmp/rootfs.tar.xz
          df -h /

      - name: Split and upload rootfs archive
        run: |
          # Split into 1.9GB chunks for artifact upload
          split -b 1900m /tmp/rootfs.tar.xz /tmp/rootfs_part_
          ls -lh /tmp/rootfs_part_*
          echo "parts=$(ls /tmp/rootfs_part_* | wc -l | tr -d ' ')"

      - name: Upload rootfs parts
        uses: actions/upload-artifact@v4
        with:
          name: macos-rootfs
          path: /tmp/rootfs_part_*
          retention-days: 3

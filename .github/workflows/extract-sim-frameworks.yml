name: Extract Simulator Metal Frameworks

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-14  # Apple Silicon (arm64), Xcode 15.4 default

    steps:
      - name: Environment info
        run: |
          xcodebuild -version
          sw_vers
          uname -m

      - name: Probe all possible framework locations
        run: |
          set +e
          echo "=== macOS system PrivateFrameworks ==="
          ls /System/Library/PrivateFrameworks/ | grep -iE "^MTL|^Metal"

          echo ""
          echo "=== Xcode.app: MTLSimDriver ==="
          find /Applications/Xcode.app -name "MTLSimDriver.framework" 2>/dev/null

          echo ""
          echo "=== Xcode.app: MTLSimImplementation ==="
          find /Applications/Xcode.app -name "MTLSimImplementation.framework" 2>/dev/null

          echo ""
          echo "=== Xcode.app: MetalSerializer ==="
          find /Applications/Xcode.app -name "MetalSerializer.framework" 2>/dev/null

          echo ""
          echo "=== iPhoneSimulator.platform PrivateFrameworks ==="
          PLAT="/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneSimulator.platform"
          find "$PLAT" -name "MTLSim*.framework" -o -name "MetalSerializer.framework" 2>/dev/null

          echo ""
          echo "=== CoreSimulator pre-installed runtimes ==="
          ls /Library/Developer/CoreSimulator/Profiles/Runtimes/ 2>/dev/null || echo "(none)"
          ls /Library/Developer/CoreSimulator/Images/ 2>/dev/null || echo "(no Images dir)"
          ls /Library/Developer/CoreSimulator/Volumes/ 2>/dev/null || echo "(no Volumes dir)"
          xcrun simctl runtime list 2>/dev/null || true

      - name: Collect frameworks
        run: |
          set +e
          OUT="sim-frameworks"
          mkdir -p "$OUT"
          MISSING=""

          copy_fw() {
            local FW="$1"
            local SRC="$2"
            if [ -d "$SRC" ]; then
              echo "  [OK] copying from $SRC"
              cp -R "$SRC" "$OUT/"
              BIN=$(find "$OUT/${FW}.framework" -name "$FW" -not -name "*.h" -type f | head -1)
              [ -n "$BIN" ] && lipo -info "$BIN" 2>/dev/null || echo "  (no binary)"
              return 0
            fi
            return 1
          }

          find_fw() {
            local FW="$1"
            echo "--- $FW ---"

            # 1. macOS system PrivateFrameworks (MTLSimImplementation, MetalSerializer live here)
            copy_fw "$FW" "/System/Library/PrivateFrameworks/${FW}.framework" && return

            # 2. Inside Xcode iPhoneSimulator.platform
            PLAT="/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneSimulator.platform"
            SRC=$(find "$PLAT" -name "${FW}.framework" -type d 2>/dev/null | head -1)
            [ -n "$SRC" ] && copy_fw "$FW" "$SRC" && return

            # 3. Anywhere in Xcode.app
            SRC=$(find /Applications/Xcode.app -name "${FW}.framework" -type d 2>/dev/null | head -1)
            [ -n "$SRC" ] && copy_fw "$FW" "$SRC" && return

            # 4. CoreSimulator installed runtimes
            SRC=$(find /Library/Developer/CoreSimulator -name "${FW}.framework" -type d 2>/dev/null | head -1)
            [ -n "$SRC" ] && copy_fw "$FW" "$SRC" && return

            echo "  [MISSING] $FW.framework not found on this runner"
            MISSING="$MISSING $FW"
          }

          find_fw MTLSimDriver
          find_fw MTLSimImplementation
          find_fw MetalSerializer

          echo ""
          echo "=== Result ==="
          find "$OUT" -type f | sort
          du -sh "$OUT" 2>/dev/null || true

          if [ -n "$MISSING" ]; then
            echo ""
            echo "MISSING frameworks:$MISSING"
            echo "These require an iOS Simulator runtime to be installed."
            exit 1
          fi

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sim-metal-frameworks
          path: sim-frameworks/
          retention-days: 7

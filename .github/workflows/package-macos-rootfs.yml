name: Package macOS 13.4 Rootfs

on:
  workflow_dispatch:

jobs:
  package-rootfs:
    runs-on: macos-14

    steps:
      - name: Free up disk space
        run: |
          # 删除大文件腾出空间 (Xcode ~10GB, CoreSimulator Images ~20GB)
          sudo rm -rf /Applications/Xcode_15.*.app 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator/Images 2>/dev/null || true
          df -h /

      - name: Download rootfs and cryptex DMGs from IPSW via HTTP Range
        run: |
          set -euo pipefail

          python3 << 'PYEOF'
          import struct, urllib.request, sys, os

          IPSW_URL = "https://updates.cdn-apple.com/2023SpringFCS/fullrestores/032-84884/F97A22EE-9B5E-4FD5-94C1-B39DCEE8D80F/UniversalMac_13.4_22F66_Restore.ipsw"

          def http_range(url, start, end=None):
              req = urllib.request.Request(url)
              rng = f"bytes={start}-{end}" if end is not None else f"bytes={start}-"
              req.add_header("Range", rng)
              return urllib.request.urlopen(req)

          def parse_zip64_extra(extra, need_uncomp, need_comp, need_offset):
              i = 0
              while i + 4 <= len(extra):
                  tag  = struct.unpack_from('<H', extra, i)[0]
                  size = struct.unpack_from('<H', extra, i+2)[0]
                  data = extra[i+4:i+4+size]
                  if tag == 0x0001:
                      off = 0
                      uncomp = comp = lhdr = None
                      if need_uncomp and off + 8 <= len(data):
                          uncomp = struct.unpack_from('<Q', data, off)[0]; off += 8
                      if need_comp and off + 8 <= len(data):
                          comp  = struct.unpack_from('<Q', data, off)[0]; off += 8
                      if need_offset and off + 8 <= len(data):
                          lhdr  = struct.unpack_from('<Q', data, off)[0]
                      return uncomp, comp, lhdr
                  i += 4 + size
              return None, None, None

          # 获取 IPSW 大小并解析 ZIP64 中心目录（只做一次）
          req = urllib.request.Request(IPSW_URL, method='HEAD')
          with urllib.request.urlopen(req) as r:
              total_size = int(r.headers['Content-Length'])
          print(f"IPSW 总大小: {total_size/1e9:.1f} GB")

          with http_range(IPSW_URL, total_size - 65536) as r:
              tail = r.read()

          eocd_rel = tail.rfind(b'PK\x05\x06')
          if eocd_rel < 0:
              print("ERROR: EOCD not found"); sys.exit(1)
          eocd = tail[eocd_rel:]
          cd_size   = struct.unpack_from('<I', eocd, 12)[0]
          cd_offset = struct.unpack_from('<I', eocd, 16)[0]

          if cd_offset == 0xFFFFFFFF:
              loc_rel = tail.rfind(b'PK\x06\x07')
              if loc_rel < 0:
                  print("ERROR: ZIP64 Locator not found"); sys.exit(1)
              z64off = struct.unpack_from('<Q', tail, loc_rel + 8)[0]
              with http_range(IPSW_URL, z64off, z64off + 255) as r:
                  z64 = r.read()
              cd_size   = struct.unpack_from('<Q', z64, 40)[0]
              cd_offset = struct.unpack_from('<Q', z64, 48)[0]

          print(f"Central Directory: offset={cd_offset:,} size={cd_size:,}")
          with http_range(IPSW_URL, cd_offset, cd_offset + cd_size - 1) as r:
              cd_data = r.read()

          # 建立文件名 -> (local_offset, comp_size, comp_method) 的映射
          index = {}
          pos = 0
          while pos < len(cd_data):
              if cd_data[pos:pos+4] != b'PK\x01\x02':
                  break
              comp_method = struct.unpack_from('<H', cd_data, pos+10)[0]
              comp_sz     = struct.unpack_from('<I', cd_data, pos+20)[0]
              uncomp_sz   = struct.unpack_from('<I', cd_data, pos+24)[0]
              fname_len   = struct.unpack_from('<H', cd_data, pos+28)[0]
              extra_len   = struct.unpack_from('<H', cd_data, pos+30)[0]
              comment_len = struct.unpack_from('<H', cd_data, pos+32)[0]
              lhdr_off    = struct.unpack_from('<I', cd_data, pos+42)[0]
              fname = cd_data[pos+46:pos+46+fname_len].decode('utf-8', errors='replace')
              extra = cd_data[pos+46+fname_len:pos+46+fname_len+extra_len]
              if uncomp_sz == 0xFFFFFFFF or comp_sz == 0xFFFFFFFF or lhdr_off == 0xFFFFFFFF:
                  z_u, z_c, z_l = parse_zip64_extra(extra,
                      uncomp_sz == 0xFFFFFFFF,
                      comp_sz   == 0xFFFFFFFF,
                      lhdr_off  == 0xFFFFFFFF)
                  if z_u is not None: uncomp_sz = z_u
                  if z_c is not None: comp_sz   = z_c
                  if z_l is not None: lhdr_off  = z_l
              index[fname] = (lhdr_off, comp_sz, comp_method)
              pos += 46 + fname_len + extra_len + comment_len

          print(f"ZIP 索引共 {len(index)} 个文件")

          def download_entry(target, out_path):
              if target not in index:
                  print(f"ERROR: {target} 不在 ZIP 中"); sys.exit(1)
              lhdr_off, comp_sz, comp_method = index[target]
              print(f"\n--- {target} ---")
              print(f"  comp_method={comp_method} size={comp_sz/1e9:.2f} GB")
              if comp_method != 0:
                  print("ERROR: 文件有压缩，无法 Range 提取"); sys.exit(1)
              with http_range(IPSW_URL, lhdr_off, lhdr_off + 1023) as r:
                  lhdr = r.read()
              fn_len = struct.unpack_from('<H', lhdr, 26)[0]
              ex_len = struct.unpack_from('<H', lhdr, 28)[0]
              data_start = lhdr_off + 30 + fn_len + ex_len
              print(f"  data_start={data_start:,}, 开始下载...")
              CHUNK = 8 * 1024 * 1024
              done = 0
              with http_range(IPSW_URL, data_start, data_start + comp_sz - 1) as r:
                  with open(out_path, 'wb') as f:
                      while True:
                          chunk = r.read(CHUNK)
                          if not chunk: break
                          f.write(chunk)
                          done += len(chunk)
                          print(f"\r  {done/1e9:.2f}/{comp_sz/1e9:.2f} GB ({done/comp_sz*100:.1f}%)", end='', flush=True)
              print(f"\n  完成: {os.path.getsize(out_path):,} bytes")

          download_entry("096-09648-074.dmg", "/tmp/rootfs.dmg")    # arm64 rootfs ~6.9GB
          download_entry("096-09706-077.dmg", "/tmp/cryptex.dmg")   # OS cryptex  ~4.1GB
          PYEOF

          ls -lh /tmp/rootfs.dmg /tmp/cryptex.dmg
          df -h /

      - name: Mount DMGs and create tarballs
        run: |
          set -euo pipefail

          echo "=== 挂载 rootfs ==="
          sudo hdiutil attach /tmp/rootfs.dmg  -mountpoint /tmp/rootfs_mount  -nobrowse -readonly
          echo "=== 挂载 cryptex ==="
          sudo hdiutil attach /tmp/cryptex.dmg -mountpoint /tmp/cryptex_mount -nobrowse -readonly
          df -h /

          echo "=== 打包 rootfs.tar.gz ==="
          sudo tar -C /tmp/rootfs_mount  -czf /tmp/rootfs.tar.gz  .
          echo "=== 打包 cryptex.tar.gz ==="
          sudo tar -C /tmp/cryptex_mount -czf /tmp/cryptex.tar.gz .

          sudo hdiutil detach /tmp/rootfs_mount  || true
          sudo hdiutil detach /tmp/cryptex_mount || true
          ls -lh /tmp/rootfs.tar.gz /tmp/cryptex.tar.gz
          df -h /

      - name: Split and upload
        run: |
          # rootfs 较大，按 1.9GB 分割；cryptex 较小，不一定需要分割
          split -b 1900m /tmp/rootfs.tar.gz  /tmp/rootfs_part_
          split -b 1900m /tmp/cryptex.tar.gz /tmp/cryptex_part_
          ls -lh /tmp/rootfs_part_* /tmp/cryptex_part_*

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-13.4-rootfs
          path: /tmp/rootfs_part_*
          retention-days: 3

      - name: Upload cryptex artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-13.4-cryptex
          path: /tmp/cryptex_part_*
          retention-days: 3
